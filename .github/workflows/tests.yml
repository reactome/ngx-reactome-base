name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # This name is the status check that branch protection requires on main.
    # Renaming the job leaves main requiring a check that never reports, and
    # every pull request waits on it forever.
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # In dependency order: the diagram and the demo app import the style
      # library from dist/, so nothing else type-checks until it is built.
      - name: Build the libraries
        run: npm run build:libs

      # Formatting is checked, not applied: a CI job that pushes a formatting
      # commit back cannot run on a protected main, and silently formats nothing
      # once it breaks -- which is what WebsiteAngular's old one did for months.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run check:lint

      # eslint sees unused symbols within a file; knip sees whole files and
      # exports nothing imports. Held to dead-code-baseline.json, like the lint
      # warnings, so the count can only go down.
      - name: Check unreachable code has not increased
        run: npm run check:dead

      - name: Test
        run: npm test

      - name: Build the demo app
        run: npx ng build ngx-reactome-base

      # What would be published: a package that packs is a package that installs.
      - name: Pack the libraries
        run: |
          for lib in ngx-reactome-cytoscape-style ngx-reactome-style ngx-reactome-diagram; do
            (cd "dist/$lib" && npm pack --dry-run)
          done
